name: CI

on: [push, pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run evaluation harness
        run: PYTHONPATH=src python -m evalharness.run_eval --runs 3
      - name: Regression gate (fail on >2pp drop vs baseline)
        run: PYTHONPATH=src python -m evalharness.regression_gate
